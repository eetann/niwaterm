<!doctype html>
<html lang="ja" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>niwaterm</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <aside id="sidebar">
      <div id="sidebar-toolbar"></div>
      <div id="sidebar-switcher" hidden></div>
      <div id="sidebar-body">
        <div id="sidebar-list"></div>
        <div id="sidebar-custom-view"></div>
      </div>
    </aside>
    <div id="command-palette-root"></div>
    <div id="confirm-dialog-root"></div>
    <div id="prompt-dialog-root"></div>
    <div id="config-dialog-root"></div>
    <div id="workspace-picker-root"></div>
    <div id="selection-menu-root"></div>
    <div id="hint-layer" hidden></div>
    <div id="sidebar-divider" class="divider"></div>
    <div id="screen">
      <div id="tile-tree"></div>
      <div id="no-board" hidden>
        <p id="no-board-message">このワークスペースにはBoardがありません</p>
        <button id="no-board-new" type="button">新しいBoardを作成</button>
      </div>
      <div id="composition"></div>
      <textarea
        id="ime-input"
        wrap="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      ></textarea>
      <span id="measure">W</span>
    </div>
    <div id="popup" hidden>
      <div id="popup-box">
        <div id="popup-toolbar"></div>
        <div id="popup-content">
          <div class="term"></div>
          <div class="cursor"></div>
          <div class="copy-overlay"></div>
          <div class="copied-badge"></div>
        </div>
      </div>
    </div>
    <template id="tile-template">
      <div class="tile">
        <div class="tab-bar"></div>
        <div class="tile-content"></div>
      </div>
    </template>
    <template id="tab-content-template">
      <div class="tab-content">
        <div class="term"></div>
        <div class="cursor"></div>
        <div class="copy-overlay"></div>
        <div class="copied-badge"></div>
      </div>
    </template>
    <script type="module" src="index.js"></script>
  </body>
</html>
