<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>niwaterm</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="screen">
      <div id="tile-tree"></div>
      <div id="composition"></div>
      <textarea id="ime-input" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
      <span id="measure">W</span>
    </div>
    <template id="tile-template">
      <div class="tile">
        <div class="tab-bar">
          <button class="tab-add-btn" type="button" tabindex="-1">+</button>
        </div>
        <div class="tile-content"></div>
      </div>
    </template>
    <template id="tab-button-template">
      <button class="tab-button" type="button" tabindex="-1">
        <span class="tab-label"></span>
        <span class="tab-close-btn">×</span>
      </button>
    </template>
    <template id="tab-content-template">
      <div class="tab-content">
        <div class="term"></div>
        <div class="cursor"></div>
      </div>
    </template>
    <script type="module" src="index.js"></script>
  </body>
</html>
