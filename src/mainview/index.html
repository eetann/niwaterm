<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>niwaterm</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <aside id="sidebar">
      <div id="sidebar-switcher" hidden>
        <button id="sidebar-switch-list" type="button" tabindex="-1" class="active">
          Workspaces
        </button>
        <button id="sidebar-switch-custom" type="button" tabindex="-1"></button>
      </div>
      <div id="sidebar-body">
        <div id="sidebar-list"></div>
        <div id="sidebar-custom-view"></div>
      </div>
    </aside>
    <div id="screen">
      <div id="tile-tree"></div>
      <div id="composition"></div>
      <textarea id="ime-input" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
      <span id="measure">W</span>
    </div>
    <template id="sidebar-workspace-template">
      <div class="sidebar-workspace">
        <button class="sidebar-workspace-header" type="button" tabindex="-1"></button>
        <div class="sidebar-tab-list"></div>
      </div>
    </template>
    <template id="sidebar-tab-template">
      <button class="sidebar-tab" type="button" tabindex="-1"></button>
    </template>
    <template id="tile-template">
      <div class="tile">
        <div class="tab-bar">
          <button class="tab-add-btn" type="button" tabindex="-1">+</button>
        </div>
        <div class="tile-content"></div>
      </div>
    </template>
    <template id="tab-button-template">
      <button class="tab-button" type="button" tabindex="-1">
        <span class="tab-label"></span>
        <span class="tab-close-btn">×</span>
      </button>
    </template>
    <template id="tab-content-template">
      <div class="tab-content">
        <div class="term"></div>
        <div class="cursor"></div>
      </div>
    </template>
    <template id="browser-toolbar-template">
      <div class="browser-toolbar">
        <button class="browser-back" type="button" tabindex="-1" title="戻る">←</button>
        <button class="browser-forward" type="button" tabindex="-1" title="進む">→</button>
        <button class="browser-reload" type="button" tabindex="-1" title="再読み込み">⟳</button>
        <input class="browser-url-input" type="text" spellcheck="false" autocomplete="off" />
      </div>
    </template>
    <script type="module" src="index.js"></script>
  </body>
</html>
