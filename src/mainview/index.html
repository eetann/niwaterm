<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>niwaterm</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="screen">
      <div id="tile-tree"></div>
      <div id="composition"></div>
      <textarea id="ime-input" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
      <span id="measure">W</span>
    </div>
    <template id="tile-template">
      <div class="tile">
        <div class="term"></div>
        <div class="cursor"></div>
      </div>
    </template>
    <script type="module" src="index.js"></script>
  </body>
</html>
