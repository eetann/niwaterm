<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Claude Prompts</title>
    <style>
      /*
       * 地はniwatermのターミナルと同じ背景色＋背景画像（niwaterm.theme）で塗る。webviewの背後は
       * 透かせないため、サイドバーへ馴染ませるには同じ塗り方を自分で再現する。
       * 中間色は文字色からの透明度だけで作り、背景のグラデーションを潰さないようにする
       */
      :root {
        --bg: #1a1b1e;
        --bg-image: none;
        --fg: #e6e6e6;
        --muted: color-mix(in srgb, var(--fg) 60%, transparent);
        --faint: color-mix(in srgb, var(--fg) 40%, transparent);
        --border: color-mix(in srgb, var(--fg) 22%, transparent);
        --hover: color-mix(in srgb, var(--fg) 10%, transparent);
        --selected: color-mix(in srgb, var(--fg) 18%, transparent);
        --accent: #60a5fa;
        --error: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: var(--bg);
        background-image: var(--bg-image);
        background-size: cover;
        background-position: center;
        color: var(--fg);
        font: 12px/1.6 system-ui, sans-serif;
      }
      button {
        flex: none;
        padding: 3px 7px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--hover);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      header,
      footer {
        padding: 6px;
        flex: none;
        display: flex;
        gap: 4px;
        align-items: center;
      }
      header {
        border-bottom: 1px solid var(--border);
      }
      footer {
        border-top: 1px solid var(--border);
        color: var(--muted);
      }
      #position {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #toc {
        flex: none;
        max-height: 30vh;
        overflow-y: auto;
        margin: 0;
        padding: 0;
        list-style: none;
        border-bottom: 1px solid var(--border);
      }
      #toc.hidden {
        display: none;
      }
      #toc li {
        padding: 3px 6px;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
      }
      #toc li:hover {
        background: var(--hover);
      }
      #toc li[aria-selected="true"] {
        background: var(--selected);
        color: var(--fg);
      }
      #blocks {
        flex: 1;
        overflow-y: auto;
        padding: 6px;
      }
      .block {
        margin-bottom: 8px;
      }
      /* プロンプト本文・応答・ツール結果は改行と字下げがそのまま意味を持つので折り返しだけ効かせる */
      .text {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .prompt {
        padding: 5px 6px;
        border-left: 2px solid var(--accent);
        background: var(--hover);
      }
      .tool {
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .thinking > summary,
      .result > summary {
        color: var(--faint);
        cursor: pointer;
      }
      .thinking > .text,
      .result > .text {
        margin-top: 3px;
        padding-left: 6px;
        border-left: 1px solid var(--border);
        color: var(--muted);
      }
      #status {
        padding: 6px;
        color: var(--muted);
      }
      #status.error {
        color: var(--error);
      }
    </style>
  </head>
  <body>
    <header>
      <button id="prev" title="前のプロンプト">‹</button>
      <span id="position"></span>
      <button id="next" title="次のプロンプト">›</button>
      <button id="toggle-toc" title="目次の表示を切り替える">目次</button>
      <button id="reload" title="再読み込み">⟳</button>
    </header>
    <ul id="toc" class="hidden"></ul>
    <div id="status"></div>
    <div id="blocks"></div>
    <footer id="tab"></footer>

    <script>
      const tocEl = document.getElementById("toc");
      const blocksEl = document.getElementById("blocks");
      const statusEl = document.getElementById("status");
      const positionEl = document.getElementById("position");
      const tabEl = document.getElementById("tab");
      const prevEl = document.getElementById("prev");
      const nextEl = document.getElementById("next");

      let prompts = [];
      let index = 0;
      /** 今表示しているプロンプトの識別子。目次からの選択に追従したかの判定に使う */
      let shownKey = null;

      /*
       * window.niwatermはniwaterm本体がdom-ready後に注入するため、読み込み直後には
       * まだ無いことがある。既にあればそのまま、無ければniwaterm:readyを待つ
       */
      function whenReady() {
        if (window.niwaterm) return Promise.resolve();
        return new Promise((resolve) => {
          window.addEventListener("niwaterm:ready", resolve, { once: true });
        });
      }

      /** niwatermの配色を受け取ってCSS変数へ流し込む。設定のホットリロード時も呼ばれる */
      function applyTheme() {
        const theme = window.niwaterm && window.niwaterm.theme;
        if (!theme) return;
        const root = document.documentElement.style;
        root.setProperty("--bg", theme.background);
        root.setProperty("--bg-image", theme.backgroundImage);
        root.setProperty("--fg", theme.foreground);
      }

      function setStatus(text, isError) {
        statusEl.textContent = text || "";
        statusEl.classList.toggle("error", Boolean(isError));
        statusEl.style.display = text ? "block" : "none";
      }

      function oneLine(text) {
        return text.replace(/\s+/g, " ").trim();
      }

      /** 折りたためるブロック。thinkingとツール結果は既定で畳んで本文の流れを邪魔しない */
      function details(className, summary, text) {
        const el = document.createElement("details");
        el.className = `block ${className}`;
        const head = document.createElement("summary");
        head.textContent = summary;
        el.appendChild(head);
        const body = document.createElement("div");
        body.className = "text";
        body.textContent = text;
        el.appendChild(body);
        return el;
      }

      function blockElement(block) {
        if (block.kind === "prompt" || block.kind === "assistant") {
          const el = document.createElement("div");
          el.className = `block text${block.kind === "prompt" ? " prompt" : ""}`;
          el.textContent = block.text;
          return el;
        }
        if (block.kind === "tool") {
          const el = document.createElement("div");
          el.className = "block tool";
          el.textContent = `⏺ ${block.name}${block.input ? `: ${oneLine(block.input)}` : ""}`;
          return el;
        }
        if (block.kind === "thinking") {
          return details("thinking", `✻ ${oneLine(block.text).slice(0, 60)}`, block.text);
        }
        const suffix = block.truncated ? "（以降は省略）" : "";
        return details("result", `⎿ ${oneLine(block.text).slice(0, 60)}${suffix}`, block.text);
      }

      function renderToc() {
        tocEl.replaceChildren();
        prompts.forEach((prompt) => {
          const li = document.createElement("li");
          li.setAttribute("aria-selected", String(prompt.index === index));
          li.textContent = `${prompt.index}. ${oneLine(prompt.text)}`;
          li.title = oneLine(prompt.text);
          li.addEventListener("click", () => load(prompt.index));
          tocEl.appendChild(li);
        });
      }

      function renderBlocks(blocks) {
        blocksEl.replaceChildren();
        for (const block of blocks) blocksEl.appendChild(blockElement(block));
        blocksEl.scrollTop = 0;
      }

      async function load(nextIndex) {
        setStatus("読み込み中…");
        try {
          const result = await niwaterm.call(
            "load",
            typeof nextIndex === "number" ? { index: nextIndex } : {},
          );
          if (!result.ready) {
            prompts = [];
            shownKey = null;
            positionEl.textContent = "";
            tabEl.textContent = "";
            tocEl.replaceChildren();
            blocksEl.replaceChildren();
            setStatus(result.message);
            return;
          }
          prompts = result.prompts;
          index = result.index;
          shownKey = `${result.tabId}#${index}`;
          positionEl.textContent = `${index} / ${prompts.length}`;
          tabEl.textContent = result.tabId;
          prevEl.disabled = index <= 1;
          nextEl.disabled = index >= prompts.length;
          renderToc();
          renderBlocks(result.blocks);
          setStatus("");
        } catch (err) {
          setStatus(err.message, true);
        }
      }

      prevEl.addEventListener("click", () => index > 1 && load(index - 1));
      nextEl.addEventListener("click", () => index < prompts.length && load(index + 1));
      document.getElementById("reload").addEventListener("click", () => load(index || undefined));
      document.getElementById("toggle-toc").addEventListener("click", () => {
        tocEl.classList.toggle("hidden");
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft" && index > 1) load(index - 1);
        else if (e.key === "ArrowRight" && index < prompts.length) load(index + 1);
      });

      /**
       * 目次のクリックはniwaterm本体側で起きるため、このHTMLはイベントとして受け取れない。
       * ビューアを開いたままでも選び直しに追従できるよう、選択だけを定期的に見に行く
       * （transcriptを読まない軽いハンドラなので、この間隔で問い合わせても負荷にならない）
       */
      async function followSelection() {
        if (document.hidden) return;
        try {
          const selection = await niwaterm.call("selection");
          if (!selection) return;
          if (`${selection.tabId}#${selection.index}` === shownKey) return;
          await load(selection.index);
        } catch {
          // 一時的な失敗で定期チェックを止めない（次の周期で拾い直す）
        }
      }

      window.addEventListener("niwaterm:theme", applyTheme);
      whenReady().then(() => {
        applyTheme();
        load();
        setInterval(followSelection, 1200);
      });
    </script>
  </body>
</html>
