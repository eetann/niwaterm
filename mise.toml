# WindowsでElectrobunアプリをビルド・起動する手順は docs/windows-build.md 参照。
# ここではその中で毎回発生するWSL→Windows間のファイル同期をタスク化している。
#
# 環境依存の値（Windows側のユーザー名を含むパスなど）はこのファイルにコミットせず、
# 同じディレクトリに mise.local.toml（.gitignore対象、各自手動作成）を置いて上書きすること。
# 例:
#
#   [env]
#   NIWATERM_WIN_WORKTREES_ROOT = "/mnt/c/Users/<ユーザー名>/niwaterm-worktrees"
#
# niwaterm-wip（開発中ビルド）はgtrで作成した追加のgit worktree（devブランチ）で、
# niwaterm-daily（普段遣いビルド）はこのリポジトリ本体（mainブランチ、gitの
# メインワークツリー）で動かす運用にしている（electrobun 2.0.1のプロジェクトビルドロックは
# 同一project_root配下だと同時起動できないため、実体そのものを分離する必要がある）。Windows側もそれぞれ $NIWATERM_WIN_WORKTREES_ROOT/<ディレクトリ名>/ へ配置する。
# ディレクトリ名はgit管理下のディレクトリのbasenameをそのまま使うため、mainブランチ側
# （メインワークツリー）も追加のgit worktreeも同じロジックで解決できる。値自体はどちらの
# 作業ディレクトリでも共通なので、mise.local.tomlはそれぞれにこの1行をコピーするだけでよい。
#
# アプリ名(NIWATERM_APP_NAME)は現在のブランチから自動判定する（mainならniwaterm-daily、
# それ以外はniwaterm-wip）。詳細はstartタスク参照。
#
# package.jsonのscriptsとmiseタスクの棲み分け:
# OS・ブランチに依存しない素のツールチェーン（lint/format/test）だけをpackage.jsonに残し、
# 実行環境で中身が変わるもの（起動・ネイティブビルド・Windows同期）はすべてここへ集約する。
# 他タスクからしか呼ばれない実処理は`hide = true`で`mise tasks`・補完から隠している
# （直接`mise run`することは可能）。

# ネイティブ成果物（libghostty-vtのシム・PTYの制御端末ラッパー）のビルド。何を作るかは
# 実行環境で決まる（macOSはローカル向けの.dylib、WSLはzigでWindows向けの.dllへクロスビルド）ため、
# ここで判別して実処理タスクへ振り分ける。
[tasks."build:native"]
description = "libghostty-vtのシムとPTYラッパーを現在の環境向けにビルドする（macOSはローカル向け、WSLはWindows向けクロスビルド）"
run = '''
if [ "$(uname -s)" = "Darwin" ]; then
  mise run build:native:mac
elif grep -qi microsoft /proc/version 2>/dev/null; then
  mise run build:native:win
else
  echo "ネイティブ成果物のビルドはmacOS（ローカル向け）とWSL（Windows向けクロスビルド）のみ対応しています" >&2
  exit 1
fi
'''

# niwaterm-ptyexecはmacOS専用。WindowsのPTYはConPTYで制御端末の付け替えが不要なため
# （src/bun/pty.tsのwithPtyExec参照）
[tasks."build:native:mac"]
hide = true
description = "shimとniwaterm-ptyexecをmacOS向けにビルドする（build:nativeから呼ばれる）"
run = '''
cc -dynamiclib -Ivendor/libghostty/include src/native/shim.c \
  -Lvendor/libghostty/lib -lghostty-vt -Wl,-rpath,@loader_path \
  -o vendor/libghostty/lib/libniwashim.dylib
cc -O2 src/native/ptyexec.c -o vendor/libghostty/lib/niwaterm-ptyexec
'''

# zigはWindowsのみDLL本体をbin/へ出す（lib/に入るのはリンク用のインポートライブラリ）。
# src/bun/ghostty.ts側の探索先もそれに合わせてbin/になっている
[tasks."build:native:win"]
hide = true
description = "shimとウィンドウ透過ヘルパーをWindows向けにクロスビルドする（build:nativeから呼ばれる）"
run = '''
mise exec zig@0.16.0 -- zig cc -target x86_64-windows-gnu -shared \
  -Ivendor/libghostty/include \
  src/native/shim.c \
  -Lvendor/libghostty/lib -lghostty-vt \
  -o vendor/libghostty/bin/niwashim.dll
# ウィンドウ透過はlibghostty-vtと無関係なのでDLLを分ける（shimはvt本体へ依存するため、
# 透過だけ使いたい場面でもvtのロードを強制してしまう）
mise exec zig@0.16.0 -- zig cc -target x86_64-windows-gnu -shared \
  src/native/winwindow.c \
  -ldwmapi -lgdi32 -luser32 \
  -o vendor/libghostty/bin/niwawin.dll
'''

# vendor（libghostty-vt本体）のビルドはシムと違い、libghostty-vtのバージョンを上げるときにしか
# 実行しないのでbuild:nativeの振り分けには含めない。
#
# **`-Doptimize=ReleaseFast`は必須**。zigの既定はDebugで、Debugビルドのlibghostty-vtは
# PageList.growのたびにPage.verifyIntegrity（全ページ走査の整合性チェック）が走るため、
# 画面スクロール1行あたり約700µsかかる（ReleaseFastでは0.05µs未満）。ターミナルとしては
# 致命的に遅く、シェルの通常出力すらPTY読み取りスレッドを止める
# （詳細: docs/known-issues/libghostty-vt-debug-build-makes-scrolling-slow.md）
[tasks."build:vendor:mac"]
description = "libghostty-vt本体をmacOS向けにビルドする（vendor更新時のみ。要 opensrc でのghosttyソース取得）"
run = '''
SRC="$(opensrc path ghostty-org/ghostty)"
DEST="$PWD/vendor/libghostty"
cd "$SRC"
mise exec zig@0.16.0 -- zig build -Demit-lib-vt \
  -Doptimize=ReleaseFast \
  --prefix "$DEST"
# dyldはパスごとにコード署名を記憶しており、同じパスのdylibを差し替えるとadhoc署名が
# 一致せずdlopen時にSIGKILL（Code Signature Invalid）で落ちる。署名し直して回避する
codesign -f -s - "$DEST/lib/libghostty-vt.0.1.0.dylib"
'''

[tasks."build:vendor:win"]
description = "libghostty-vt本体をWindows向けにクロスビルドする（vendor更新時のみ。要vendor/libghostty へのghosttyソース配置）"
run = '''
cd vendor/libghostty
# -Dtargetの`-gnu`は必須。ghosttyのbuild.zigはWindowsターゲット時にABIをMSVCへ自動で
# 切り替えるため、省略するとWSL上に無いMSVCツールチェーンを要求されて失敗する
mise exec zig@0.16.0 -- zig build -Demit-lib-vt \
  -Dtarget=x86_64-windows-gnu \
  -Doptimize=ReleaseFast \
  --prefix "$PWD"
'''

# devモードの起動口はこのタスクに一本化する（package.jsonのscriptsには置かない）。
# 現在のブランチからアプリ名(wip/daily)を自動判定するため、`start:daily`のような
# 専用タスクは用意しない。WSLとMac(Linux実機含む)で実行環境が異なるため、ここで判別して分岐する。
# 停止方法もOSで異なる（Mac等はフォアグラウンド実行なのでCtrl+Cで止まるが、
# WSL→Windows実機はバックグラウンド起動のため`mise run win:stop:mine`が別途必要）。
[tasks.start]
description = "現在のブランチに応じてniwatermをdevモードで起動する（mainはdaily扱い、それ以外はwip扱い。WSLならWindows実機へ同期して起動、それ以外はローカルでelectrobun devを起動）"
run = '''
if [ "$(git branch --show-current)" = "main" ]; then
  export NIWATERM_APP_NAME=niwaterm-daily
fi
# Hutchはelectrobun本体が導入済みかの確認だけでも
# `~/.hutch/releases/electrobun/<version>/<platform>.lock`を排他ロックで取りに行く一方、
# 起動中のelectrobun devプロセスは同じファイルを共有ロックで掴み続ける。ホーム配下の
# ユーザー単位のパスなのでproject_rootを分けても競合し、後発の起動が無期限にブロックされる。
# HUTCH_HOME自体をアプリ名別に分けて回避する
# （詳細: docs/known-issues/hutch-electrobun-release-lock-blocks-concurrent-dev.md）
APP_NAME="${NIWATERM_APP_NAME:-niwaterm-wip}"
export HUTCH_HOME="$HOME/.hutch-${APP_NAME#niwaterm-}"
if [ ! -d "$HUTCH_HOME" ]; then
  echo "HUTCH_HOME ($HUTCH_HOME) がまだありません。このまま進めるとelectrobun/cottontail/bunの再ダウンロードが走ります。"
  echo "既存のストアをコピーすれば再ダウンロードを省けます: cp -R ~/.hutch $HUTCH_HOME"
fi
if grep -qi microsoft /proc/version 2>/dev/null; then
  mise run win:sync
  mise run win:start
else
  bun x electrobun dev
fi
'''

[tasks."win:sync"]
description = "WSL側のソースコードをWindows側のworktree別ディレクトリへrsyncで同期し、依存関係も入れ直す（docs/windows-build.md ステップ2相当）"
run = '''
if [ -z "$NIWATERM_WIN_WORKTREES_ROOT" ]; then
  echo "NIWATERM_WIN_WORKTREES_ROOT が未設定です。mise.toml先頭のコメントを参照し mise.local.toml に設定してください" >&2
  exit 1
fi
WORKTREE_NAME=$(basename "$(git rev-parse --show-toplevel)")
TARGET="$NIWATERM_WIN_WORKTREES_ROOT/$WORKTREE_NAME"
rsync -a --delete --exclude '.git' --exclude 'node_modules' --exclude 'build' --exclude 'vendor' \
  --exclude '.hutch' --exclude '.tailwind-build' \
  ./ "$TARGET/"
echo "synced to $TARGET"
# vendor/はghosttyソース全体(数百MB)を含むため丸ごとの同期対象からは除外しているが、
# 実行時に必要なビルド成果物(bin/*.dll・include/、docs/build/windows-build.md ステップ3参照)だけは
# 新規ディレクトリ作成時の同期漏れを防ぐため個別に同期する。宛先の"vendor"自体が存在しない
# 新規ディレクトリの場合、rsyncが多階層の中間ディレクトリを一度に作れず失敗するため、
# --mkpathで宛先の中間ディレクトリを明示的に作らせる。
if [ -d vendor/libghostty/bin ]; then
  rsync -a --mkpath vendor/libghostty/bin/ "$TARGET/vendor/libghostty/bin/"
  rsync -a --mkpath vendor/libghostty/include/ "$TARGET/vendor/libghostty/include/"
fi
# node_modulesはrsync対象外（ネイティブなbunバイナリが必要なため）なので、
# 新規ディレクトリ作成時・package.json変更時の同期漏れを防ぐため毎回入れ直す。
# 依存が変わっていなければbun installはキャッシュが効き高速なので、常時実行のコストは小さい。
powershell.exe -NoProfile -Command "[Console]::OutputEncoding=[Text.Encoding]::UTF8; \$env:PATH=[Environment]::GetEnvironmentVariable('PATH','User')+';'+[Environment]::GetEnvironmentVariable('PATH','Machine'); cd \$env:USERPROFILE\niwaterm-worktrees\\$WORKTREE_NAME; bun install"
'''

# ログは固定パスに毎回上書き（ファイルが際限なく増えないようにするため）。
# 起動コマンド自体は .agents/skills/windows-gui-testing/SKILL.md の定型と同じ。
[tasks."win:start"]
hide = true
description = "Windows実機でniwatermをdevモードでバックグラウンド起動する（要win:sync済み。startタスクが解決したNIWATERM_APP_NAMEを引き継ぐ）"
run = '''
WORKTREE_NAME=$(basename "$(git rev-parse --show-toplevel)")
APP_NAME="${NIWATERM_APP_NAME:-niwaterm-wip}"
LOG_FILE="/tmp/niwaterm-win-${APP_NAME#niwaterm-}.log"
# HUTCH_HOMEはWSL側のexportではWindows側のプロセスに伝わらないため、ここで明示的に渡す
# （分離する理由はstartタスクのコメント参照）
HUTCH_SUFFIX="${APP_NAME#niwaterm-}"
nohup powershell.exe -NoProfile -Command "[Console]::OutputEncoding=[Text.Encoding]::UTF8; \$env:PATH=[Environment]::GetEnvironmentVariable('PATH','User')+';'+[Environment]::GetEnvironmentVariable('PATH','Machine'); \$env:NIWATERM_APP_NAME='$APP_NAME'; \$env:HUTCH_HOME=\$env:USERPROFILE + '\.hutch-$HUTCH_SUFFIX'; cd \$env:USERPROFILE\niwaterm-worktrees\\$WORKTREE_NAME; bun x electrobun dev" > "$LOG_FILE" 2>&1 &
disown
echo "起動しました（バックグラウンド、$APP_NAME）。ログ: $LOG_FILE"
echo "停止するには: mise run win:stop:mine"
'''

# electrobun 2.0.1のHutchは`~/.hutch/state/locks/graph.lock`という
# プロジェクト単位ではなくユーザー単位でグローバルなロックを使っており、project_root自体を
# 分離していても、Hutchプロセス（electrobun dev/build問わず）が
# 1つでも生きている間は別のHutchプロセスの起動処理そのものが完全にブロックされる（実機で
# 再現・確認済み）。ビルド済みのlauncher.exeはHutch（hutch.exe/hutch-engine.exe）を経由せず
# 単独で動くため、このロックの影響を受けない。wip/dailyを同時起動したい場合は、両方を順番に
# `mise run start`でビルド完了させてから`mise run win:stop:mine`で止め、それぞれで本タスクを
# 使ってlauncher.exeを直接起動する（同時にelectrobun devでビルドしようとすると片方がスタック
# するため、ビルドは必ず順番に行うこと）。ホットリロードは失われる。
[tasks."win:start:built"]
description = "ビルド済みのlauncher.exeをelectrobun devを経由せず直接起動する（Hutchのグローバルビルドロックを回避し、wip/dailyを同時起動する場合に使う。事前にmise run startでのビルド完了が必要）"
run = '''
if [ "$(git branch --show-current)" = "main" ]; then
  APP_NAME=niwaterm-daily
else
  APP_NAME=niwaterm-wip
fi
WORKTREE_NAME=$(basename "$(git rev-parse --show-toplevel)")
powershell.exe -NoProfile -Command "[Console]::OutputEncoding=[Text.Encoding]::UTF8; \$env:PATH=[Environment]::GetEnvironmentVariable('PATH','User')+';'+[Environment]::GetEnvironmentVariable('PATH','Machine'); \$launcher = \$env:USERPROFILE + '\niwaterm-worktrees\\$WORKTREE_NAME\build\\$APP_NAME\dev-win-x64\\$APP_NAME-dev\bin\launcher.exe'; if (-not (Test-Path \$launcher)) { Write-Error (\"launcher.exeが見つかりません: \" + \$launcher + \" -- 先に mise run start でelectrobun devビルドを1回完了させてください\"); exit 1 }; Start-Process -FilePath \$launcher"
echo "launcher.exeを直接起動しました（$APP_NAME）。Hutchのグローバルビルドロックの影響を受けないため、もう片方が起動中でも同時起動できる"
echo "停止するには: mise run win:stop:mine"
'''

# WSL→Windows間はプロセスグループもシグナルも共有しないため、win:startをCtrl+Cで止めても
# Windows側のbun.exe/electrobun.exeは残り続ける。停止は明示的なプロセスkillが必須。
# hutch.exe/hutch-engine.exe（Hutchのビルドプロセス）も対象に含める。
# Windowsのプロセスは親をkillしても子は自動終了しないため、ビルド中に強制終了すると
# hutch-engine.exeが孤児プロセスとして残り、.hutch/locks/electrobun-build.lockを掴んだまま
# 後続のビルドを無期限にブロックすることがある（実機で確認済み）。
# launcher.exe（win:start:builtがelectrobun devを経由せず直接起動したプロセス自体。子のbun.exeが
# 死んでも親のlauncher.exeは自動終了しない）も対象に含める。
[tasks."win:stop"]
description = "Windows実機で起動中のniwaterm（開発中/普段遣い問わず全て）を停止する"
run = '''
PS_PREFIX='[Console]::OutputEncoding=[Text.Encoding]::UTF8; $env:PATH=[Environment]::GetEnvironmentVariable("PATH","User")+";"+[Environment]::GetEnvironmentVariable("PATH","Machine"); '
powershell.exe -NoProfile -Command "$PS_PREFIX Get-Process | Where-Object { \$_.ProcessName -match 'bun|electrobun|hutch|launcher' } | Stop-Process -Force -ErrorAction SilentlyContinue"
echo "停止コマンドを送りました"
'''

# 開発中ビルド(niwaterm-wip-dev)と普段遣いビルド(niwaterm-daily-dev)を同時に起動できるよう、
# appSupportDir・IPCソケット・WSLブリッジポートをアプリ名別に分けている
# （src/bun/app-paths.ts・ipc-server.ts参照。NIWATERM_APP_NAME環境変数でアプリ名を切り替える。
# electrobun.config.ts参照）。停止時に無印win:stopで両方まとめて巻き込まないよう、
# 現在のブランチに対応する方だけを実行ファイルのパス(ExecutablePath)で判別して停止する。
[tasks."win:stop:mine"]
description = "現在のブランチに対応するniwatermビルドのみWindows実機で停止する（mainはdaily扱い、それ以外はwip扱い）"
run = '''
if [ "$(git branch --show-current)" = "main" ]; then
  APP_NAME=niwaterm-daily
else
  APP_NAME=niwaterm-wip
fi
powershell.exe -NoProfile -Command "Get-CimInstance Win32_Process | Where-Object { \$_.ExecutablePath -like '*$APP_NAME-dev\*' } | ForEach-Object { Stop-Process -Id \$_.ProcessId -Force -ErrorAction SilentlyContinue }"
echo "停止コマンドを送りました（$APP_NAME）"
'''

# reader lease（起動中インスタンスの生存確認、正常終了・クラッシュ問わずOSが自動解放するはずの
# advisory file lock）が実機でstaleのまま残り続け、後続のビルドが
# `Waiting for the project build lock...`のまま無期限に止まることがある。
# 本来hutch側が自動検出・削除する設計のはずだが機能しないことがあるため、手動診断・復旧用に
# 用意する。build.lockのロック状態を表示し、readers配下のstale lease（ロック不能=解放済み）は
# その場で削除、生存中のものは残す。
[tasks."win:lock-status"]
description = "現在のブランチに対応するniwatermのHutchビルドロック状態を診断する（staleなreader leaseは自動削除）"
run = '''
if [ "$(git branch --show-current)" = "main" ]; then
  APP_NAME=niwaterm-daily
else
  APP_NAME=niwaterm-wip
fi
WORKTREE_NAME=$(basename "$(git rev-parse --show-toplevel)")
echo "対象: $APP_NAME ($WORKTREE_NAME)"
powershell.exe -NoProfile -Command "\$lockDir = \$env:USERPROFILE + '\niwaterm-worktrees\' + '$WORKTREE_NAME' + '\.hutch\locks'; \$buildLock = Join-Path \$lockDir 'electrobun-build.lock'; if (Test-Path \$buildLock) { try { \$fs = [System.IO.File]::Open(\$buildLock,'Open','ReadWrite','None'); \$fs.Close(); Write-Output 'build.lock: OK (unlocked)' } catch { Write-Output 'build.lock: LOCKED (someone is building or running)' } } else { Write-Output 'build.lock: not created yet' }; \$readersDir = Join-Path \$lockDir 'electrobun-readers'; if (Test-Path \$readersDir) { \$leases = Get-ChildItem \$readersDir -Filter '*.lease'; if (\$leases.Count -eq 0) { Write-Output 'readers: none' }; foreach (\$lease in \$leases) { try { \$fs = [System.IO.File]::Open(\$lease.FullName,'Open','ReadWrite','None'); \$fs.Close(); Remove-Item \$lease.FullName -Force; Write-Output \"reader lease STALE, removed: \$(\$lease.Name)\" } catch { Write-Output \"reader lease ALIVE, kept: \$(\$lease.Name)\" } } } else { Write-Output 'readers dir: none' }; Write-Output '--- hutch-related processes (all worktrees) ---'; Get-CimInstance Win32_Process | Where-Object { \$_.ProcessName -match 'hutch' } | Select-Object ProcessId,ParentProcessId,ProcessName,ExecutablePath | Format-Table -AutoSize"
echo "build.lockがLOCKEDのまま進まない場合は、上のhutch関連プロセスを確認しStop-Processで手動終了する"
'''

# タスクバー・スタートメニューのショートカット（`launcher.exe`）が実行するのは、ビルド成果物
# （build/<アプリ名>/dev-win-x64/<アプリ名>-dev/Resources/app）へ焼き込まれたアプリコードであり、
# 同期しただけのソースではない。そのためwin:syncだけではショートカット起動側に変更が反映されず、
# かといってwin:start（electrobun dev）まで行くとアプリが起動してしまう。ビルドだけを行う
# hutchのサブコマンド（electrobun build）で「起動せずに反映する」ための口を用意する。
[tasks."win:build"]
description = "Windows実機でniwatermのdevビルドのみ行う（起動はしない。要win:sync済み。タスクバーのショートカットから起動する側を最新にする用途）"
run = '''
WORKTREE_NAME=$(basename "$(git rev-parse --show-toplevel)")
# 単体で叩かれても対象を取り違えないよう、win:stop:mineと同じくブランチから判定する
# （daily:merge-dev等から呼ばれた場合はそちらが解決したNIWATERM_APP_NAMEを優先する）
if [ -n "$NIWATERM_APP_NAME" ]; then
  APP_NAME="$NIWATERM_APP_NAME"
elif [ "$(git branch --show-current)" = "main" ]; then
  APP_NAME=niwaterm-daily
else
  APP_NAME=niwaterm-wip
fi
HUTCH_SUFFIX="${APP_NAME#niwaterm-}"
# electrobunはbuildFolder配下をビルドの度にrmSyncで丸ごと作り直すため、対象アプリが起動中だと
# ファイルロックでEACCESになる（electrobun.config.tsのbuildFolderのコメント参照）。
# 常用中のdailyを黙って落とすと作業を巻き込むので、検出したら停止はユーザーの判断に委ねて中断する。
RUNNING=$(powershell.exe -NoProfile -Command "@(Get-CimInstance Win32_Process | Where-Object { \$_.ExecutablePath -like '*$APP_NAME-dev\*' }).Count" | tr -d '\r')
if [ "${RUNNING:-0}" != "0" ]; then
  echo "$APP_NAME が起動中のためビルドできません（成果物フォルダを作り直す際にファイルがロックされる）。終了してから再実行してください: mise run win:stop:mine" >&2
  echo "なお、このタスクを$APP_NAMEのタブ内から実行していると自分ごと巻き込むので、別インスタンス（wip側のタブ等）かWindows Terminalから実行すること。daily:merge-dev経由なら再実行しても安全（マージ・同期は冪等）" >&2
  exit 1
fi
# HUTCH_HOMEを分ける理由はstartタスクのコメント参照（WSL側のexportは伝わらないため明示的に渡す）
powershell.exe -NoProfile -Command "[Console]::OutputEncoding=[Text.Encoding]::UTF8; \$env:PATH=[Environment]::GetEnvironmentVariable('PATH','User')+';'+[Environment]::GetEnvironmentVariable('PATH','Machine'); \$env:NIWATERM_APP_NAME='$APP_NAME'; \$env:HUTCH_HOME=\$env:USERPROFILE + '\.hutch-$HUTCH_SUFFIX'; cd \$env:USERPROFILE\niwaterm-worktrees\\$WORKTREE_NAME; bun x electrobun build --env=dev"
echo "ビルドしました（$APP_NAME、起動はしていない）。タスクバー等のショートカットから起動すると反映されています"
'''

# mainブランチ（メインワークツリー、daily側）でdevブランチ（gtrで追加したworktree、wip側）の
# 変更を取り込むためのタスク。ビルドロックが同一project_root配下だと競合するため、
# 実体自体を分けている（詳細は本ファイル冒頭のコメント参照）。
# vendor/はgitignore対象（worktree作成時は.gtrconfigのpostCreateフックでmainからコピーされる）
# なので、devで検証済みのビルド成果物をここでmain側にもコピーして反映する。
# 取り込みだけではタスクバーのショートカットから起動するdailyに反映されない（ショートカットが
# 起動するのはビルド成果物に焼き込まれたコードのため）ので、同期とビルドまでこのタスクで行う。
# 起動は含めない（タスクバーから起動する運用を前提にしているため。win:buildのコメントも参照）。
[tasks."daily:merge-dev"]
description = "daily側(mainブランチ)でdevブランチの変更をff-onlyで取り込み、依存関係とvendorを入れ直し、ビルドまで済ませる（起動はしない）"
run = '''
current_branch=$(git branch --show-current)
if [ "$current_branch" != "main" ]; then
  echo "mainブランチではありません（現在: $current_branch）。daily側で実行してください" >&2
  exit 1
fi
git merge --ff-only dev
bun install
DEV_WORKTREE=$(git worktree list --porcelain | awk '/^worktree /{path=$2} /^branch refs\/heads\/dev$/{print path; exit}')
if [ -z "$DEV_WORKTREE" ]; then
  echo "devブランチのworktreeが見つかりません。vendorの同期はスキップします" >&2
elif [ -d "$DEV_WORKTREE/vendor" ]; then
  rm -rf vendor
  cp -r "$DEV_WORKTREE/vendor" vendor
  echo "vendorを$DEV_WORKTREEから同期しました"
fi
# ここから先はstartタスクから起動（win:start / electrobun dev）だけを除いた内容
export NIWATERM_APP_NAME=niwaterm-daily
export HUTCH_HOME="$HOME/.hutch-daily"
if grep -qi microsoft /proc/version 2>/dev/null; then
  mise run win:sync
  mise run win:build
else
  bun x electrobun build --env=dev
fi
'''

# niwaterm CLIのリンク。ワークツリーごとに別名で共存させる。
# `bun link`はパッケージ名(@niwaterm/cli)で登録するため、複数のワークツリーから実行すると
# 後勝ちで`niwaterm`を奪い合う。実際、devワークツリーで作業していても`niwaterm`は
# daily側のソースを指したままになり、CLI側の変更が反映されていないことに気づきにくかった
# （さらにグローバルリンクがwin:sync対象外の古いコピーを指していたこともある）。
# そのため、wip側は`niwaterm-dev`という別名の薄いラッパーにして棲み分ける。
[tasks."cli:link"]
description = "現在のワークツリーのniwaterm CLIをリンクする（mainなら`niwaterm`、それ以外なら開発用の`niwaterm-dev`）"
run = '''
ROOT="$(git rev-parse --show-toplevel)"
if [ "$(git branch --show-current)" = "main" ]; then
  # daily(普段遣い)向け。bun linkでパッケージごと登録する（fzf-niwatermも一緒に張られる）
  cd "$ROOT/packages/cli" && bun link
  echo "niwaterm をリンクしました: $ROOT/packages/cli"
else
  # wip(開発中ビルド)向け。上記の理由でbun linkは使わず、別名のラッパーを置いて共存させる
  ENTRY="$ROOT/packages/cli/src/index.ts"
  BIN="$HOME/.bun/bin/niwaterm-dev"
  mkdir -p "$HOME/.bun/bin"
  cat > "$BIN" <<EOF
#!/bin/sh
# mise run cli:link が生成。直接編集しない。
# 接続先はniwaterm-wipを既定にする。niwatermのタブ内から叩いた場合はアプリが注入した
# 自インスタンスのNIWATERM_APP_VARIANTが優先されるため、他インスタンスを奪うことはない
exec env NIWATERM_APP_VARIANT="\${NIWATERM_APP_VARIANT:-niwaterm-wip}" bun "$ENTRY" "\$@"
EOF
  chmod +x "$BIN"
  echo "niwaterm-dev をリンクしました: $ENTRY"
fi
'''
