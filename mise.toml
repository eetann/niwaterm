# WindowsでElectrobunアプリをビルド・起動する手順は docs/windows-build.md 参照。
# ここではその中で毎回発生するWSL→Windows間のファイル同期をタスク化している。
#
# 環境依存の値（Windows側のユーザー名を含むパスなど）はこのファイルにコミットせず、
# 同じディレクトリに mise.local.toml（.gitignore対象、各自手動作成）を置いて上書きすること。
# 例:
#
#   [env]
#   NIWATERM_WIN_REPO = "/mnt/c/Users/<ユーザー名>/niwaterm"

# devモードの起動口はこのタスクに一本化する（`npm run start`は廃止）。
# WSLとMac(Linux実機含む)で実行環境が異なるため、ここで判別して分岐する。
# 停止方法もOSで異なる（Mac等はフォアグラウンド実行なのでCtrl+Cで止まるが、
# WSL→Windows実機はバックグラウンド起動のため`mise run win:stop`が別途必要）。
[tasks.start]
description = "devモードでniwatermを起動する（WSLならWindows実機へ同期して起動、それ以外はローカルでelectrobun devを起動）"
run = '''
if grep -qi microsoft /proc/version 2>/dev/null; then
  mise run win:sync
  mise run win:start
else
  bun x electrobun dev
fi
'''

[tasks."win:sync"]
description = "WSL側のソースコードをWindows側のリポジトリへrsyncで同期する（docs/windows-build.md ステップ2相当）"
run = '''
if [ -z "$NIWATERM_WIN_REPO" ]; then
  echo "NIWATERM_WIN_REPO が未設定です。mise.toml先頭のコメントを参照し mise.local.toml に設定してください" >&2
  exit 1
fi
rsync -a --exclude '.git' --exclude 'node_modules' --exclude 'build' --exclude 'vendor' \
  ./ "$NIWATERM_WIN_REPO/"
echo "synced to $NIWATERM_WIN_REPO"
'''

# ログは固定パスに毎回上書き（ファイルが際限なく増えないようにするため）。
# 起動コマンド自体は .claude/skills/windows-gui-testing/SKILL.md の定型と同じ。
[tasks."win:start"]
description = "Windows実機でniwatermをdevモードでバックグラウンド起動する（要win:sync済み）"
run = '''
LOG_FILE=/tmp/niwaterm-win-dev.log
nohup powershell.exe -NoProfile -Command "[Console]::OutputEncoding=[Text.Encoding]::UTF8; \$env:PATH=[Environment]::GetEnvironmentVariable('PATH','User')+';'+[Environment]::GetEnvironmentVariable('PATH','Machine'); cd \$env:USERPROFILE\niwaterm; bun x electrobun dev" > "$LOG_FILE" 2>&1 &
disown
echo "起動しました（バックグラウンド）。ログ: $LOG_FILE"
echo "停止するには: mise run win:stop"
'''

# WSL→Windows間はプロセスグループもシグナルも共有しないため、win:startをCtrl+Cで止めても
# Windows側のbun.exe/electrobun.exeは残り続ける。停止は明示的なプロセスkillが必須。
[tasks."win:stop"]
description = "Windows実機で起動中のniwaterm（bun.exe/electrobun.exe）を停止する"
run = '''
PS_PREFIX='[Console]::OutputEncoding=[Text.Encoding]::UTF8; $env:PATH=[Environment]::GetEnvironmentVariable("PATH","User")+";"+[Environment]::GetEnvironmentVariable("PATH","Machine"); '
powershell.exe -NoProfile -Command "$PS_PREFIX Get-Process | Where-Object { \$_.ProcessName -match 'bun|electrobun' } | Stop-Process -Force -ErrorAction SilentlyContinue"
echo "停止コマンドを送りました"
'''
