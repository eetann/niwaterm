# WindowsでElectrobunアプリをビルド・起動する手順は docs/windows-build.md 参照。
# ここではその中で毎回発生するWSL→Windows間のファイル同期をタスク化している。
#
# 環境依存の値（Windows側のユーザー名を含むパスなど）はこのファイルにコミットせず、
# 同じディレクトリに mise.local.toml（.gitignore対象、各自手動作成）を置いて上書きすること。
# 例:
#
#   [env]
#   NIWATERM_WIN_REPO = "/mnt/c/Users/<ユーザー名>/niwaterm"

# devモードの起動口はこのタスクに一本化する（`npm run start`は廃止）。
# WSLとMac(Linux実機含む)で実行環境が異なるため、ここで判別して分岐する。
# 停止方法もOSで異なる（Mac等はフォアグラウンド実行なのでCtrl+Cで止まるが、
# WSL→Windows実機はバックグラウンド起動のため`mise run win:stop`が別途必要）。
[tasks.start]
description = "devモードでniwatermを起動する（WSLならWindows実機へ同期して起動、それ以外はローカルでelectrobun devを起動）"
run = '''
if grep -qi microsoft /proc/version 2>/dev/null; then
  mise run win:sync
  mise run win:start
else
  bun x electrobun dev
fi
'''

[tasks."win:sync"]
description = "WSL側のソースコードをWindows側のリポジトリへrsyncで同期する（docs/windows-build.md ステップ2相当）"
run = '''
if [ -z "$NIWATERM_WIN_REPO" ]; then
  echo "NIWATERM_WIN_REPO が未設定です。mise.toml先頭のコメントを参照し mise.local.toml に設定してください" >&2
  exit 1
fi
rsync -a --delete --exclude '.git' --exclude 'node_modules' --exclude 'build' --exclude 'vendor' \
  --exclude '.hutch' --exclude '.tailwind-build' \
  ./ "$NIWATERM_WIN_REPO/"
echo "synced to $NIWATERM_WIN_REPO"
'''

# ログは固定パスに毎回上書き（ファイルが際限なく増えないようにするため）。
# 起動コマンド自体は .claude/skills/windows-gui-testing/SKILL.md の定型と同じ。
[tasks."win:start"]
description = "Windows実機でniwatermをdevモードでバックグラウンド起動する（要win:sync済み）"
run = '''
LOG_FILE=/tmp/niwaterm-win-dev.log
nohup powershell.exe -NoProfile -Command "[Console]::OutputEncoding=[Text.Encoding]::UTF8; \$env:PATH=[Environment]::GetEnvironmentVariable('PATH','User')+';'+[Environment]::GetEnvironmentVariable('PATH','Machine'); cd \$env:USERPROFILE\niwaterm; bun x electrobun dev" > "$LOG_FILE" 2>&1 &
disown
echo "起動しました（バックグラウンド）。ログ: $LOG_FILE"
echo "停止するには: mise run win:stop"
'''

# WSL→Windows間はプロセスグループもシグナルも共有しないため、win:startをCtrl+Cで止めても
# Windows側のbun.exe/electrobun.exeは残り続ける。停止は明示的なプロセスkillが必須。
[tasks."win:stop"]
description = "Windows実機で起動中のniwaterm（開発中/普段遣い問わず全て）を停止する"
run = '''
PS_PREFIX='[Console]::OutputEncoding=[Text.Encoding]::UTF8; $env:PATH=[Environment]::GetEnvironmentVariable("PATH","User")+";"+[Environment]::GetEnvironmentVariable("PATH","Machine"); '
powershell.exe -NoProfile -Command "$PS_PREFIX Get-Process | Where-Object { \$_.ProcessName -match 'bun|electrobun' } | Stop-Process -Force -ErrorAction SilentlyContinue"
echo "停止コマンドを送りました"
'''

# 開発中ビルド(niwaterm-wip-dev)と普段遣いビルド(niwaterm-daily-dev)を同時に起動できるよう、
# appSupportDir・IPCソケット・WSLブリッジポートをアプリ名別に分けている
# （src/bun/app-paths.ts・ipc-server.ts参照。NIWATERM_APP_NAME環境変数でアプリ名を切り替える。
# electrobun.config.ts参照）。停止時に無印win:stopで両方まとめて巻き込まないよう、
# 実行ファイルのパス(ExecutablePath)で判別して個別に停止できるタスクを用意する。
[tasks."win:stop:wip"]
description = "Windows実機で起動中の開発中ビルド(niwaterm-wip)のみ停止する"
run = '''
powershell.exe -NoProfile -Command "Get-CimInstance Win32_Process | Where-Object { \$_.ExecutablePath -like '*\niwaterm-wip-dev\*' } | ForEach-Object { Stop-Process -Id \$_.ProcessId -Force -ErrorAction SilentlyContinue }"
echo "開発中ビルドの停止コマンドを送りました"
'''

[tasks."win:stop:daily"]
description = "Windows実機で起動中の普段遣いビルドniwatermのみ停止する"
run = '''
powershell.exe -NoProfile -Command "Get-CimInstance Win32_Process | Where-Object { \$_.ExecutablePath -like '*\niwaterm-daily-dev\*' } | ForEach-Object { Stop-Process -Id \$_.ProcessId -Force -ErrorAction SilentlyContinue }"
echo "普段遣いビルドの停止コマンドを送りました"
'''

# ここから普段遣い用ビルドのタスク。開発中ビルドと同時に起動しても
# appSupportDir/IPCソケット/WSLブリッジポートが分離されているため干渉しない。
# NIWATERM_APP_NAME=niwaterm-dailyを指定してdevチャンネルのままアプリ名だけ変える
# （stable/canaryチャンネルは配布用インストーラ作成が目的でbin/launcher.exeが
# self-extractorに置き換わってしまうため採用していない。
# 詳細: docs/known-issues/windows-stable-build-launcher-overwrite.md）。
[tasks."start:daily"]
description = "普段遣い用ビルドをビルドして起動する（WSLならWindows実機へ同期して起動、それ以外はローカルでelectrobun devを起動）"
run = '''
if grep -qi microsoft /proc/version 2>/dev/null; then
  mise run win:sync
  mise run win:start:daily
else
  NIWATERM_APP_NAME=niwaterm-daily bun x electrobun dev
fi
'''

[tasks."win:start:daily"]
description = "Windows実機で普段遣い用ビルドをバックグラウンド起動する（要win:sync済み）"
run = '''
LOG_FILE=/tmp/niwaterm-win-daily.log
nohup powershell.exe -NoProfile -Command "[Console]::OutputEncoding=[Text.Encoding]::UTF8; \$env:PATH=[Environment]::GetEnvironmentVariable('PATH','User')+';'+[Environment]::GetEnvironmentVariable('PATH','Machine'); \$env:NIWATERM_APP_NAME='niwaterm-daily'; cd \$env:USERPROFILE\niwaterm; bun x electrobun dev" > "$LOG_FILE" 2>&1 &
disown
echo "起動しました（バックグラウンド）。ログ: $LOG_FILE"
echo "停止するには: mise run win:stop:daily"
'''

# niwaterm-wipとniwaterm-dailyを別worktree（devブランチ/mainブランチ）に分離した運用を前提に、
# daily側のworktreeでdevの変更を取り込むためのタスク
# ビルドロックがworktreeをまたいでも同一project_rootだと競合するため、worktree自体を分けている。
[tasks."daily:merge-dev"]
description = "daily側worktree(mainブランチ)でdevブランチの変更をff-onlyで取り込み、依存関係を入れ直す"
run = '''
current_branch=$(git branch --show-current)
if [ "$current_branch" != "main" ]; then
  echo "mainブランチではありません（現在: $current_branch）。daily側のworktreeで実行してください" >&2
  exit 1
fi
git merge --ff-only dev
bun install
'''
